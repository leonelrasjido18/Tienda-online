# Config de nginx para la tienda, para convivir con los demás sitios del VPS.
# Se copia a /etc/nginx/sites-available/ y se enlaza a sites-enabled/.
# certbot --nginx agrega después los bloques 443 con el certificado.

# Tienda — remerasdelarea.com
server {
    listen 80;
    listen [::]:80;
    server_name remerasdelarea.com www.remerasdelarea.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API — api.remerasdelarea.com (incluye /uploads)
server {
    listen 80;
    listen [::]:80;
    server_name api.remerasdelarea.com;
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Panel — admin.remerasdelarea.com
server {
    listen 80;
    listen [::]:80;
    server_name admin.remerasdelarea.com;
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
