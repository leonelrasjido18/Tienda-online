name: tienda-online-prod

# Deploy detrás del nginx que ya corre en el VPS (no usamos Caddy: nginx es dueño de
# 80/443). Las apps se publican SOLO en localhost y nginx las toma como proxy inverso.
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Postgres y Redis NO exponen puertos al host: viven en la red interna del compose,
# así no chocan con el Postgres que ya tiene el servidor.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/apps/api/uploads
    ports:
      - '127.0.0.1:8081:3001'

  storefront:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        APP: storefront
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_META_PIXEL_ID: ${META_PIXEL_ID}
        NEXT_PUBLIC_GA4_ID: ${GA4_ID}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:8080:3000'

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        APP: admin
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:8082:3000'

volumes:
  postgres_data:
  redis_data:
  uploads_data:
